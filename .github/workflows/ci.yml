name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret scan
        run: ./scripts/check_secrets.sh
      - name: Byte-compile
        run: python3 -m py_compile scripts/search_awards.py scripts/crosscheck.py scripts/preflight.py
      - name: Regression tests
        run: ./run_tests.sh
